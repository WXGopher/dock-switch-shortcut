<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Your Dock, one shortcut away</title>
  <desc id="desc">Illustration of generic pinned Dock apps mapping in order to Command-1, Command-2, Command-3, and Command-0. Finder is excluded.</desc>
  <rect width="960" height="280" rx="20" fill="#f6f8fa"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
    <text x="480" y="37" fill="#57606a" font-size="13" font-weight="600" letter-spacing="1.5">PINNED IN YOUR DOCK → READY ON YOUR KEYBOARD</text>
    <rect x="148" y="55" width="664" height="91" rx="23" fill="#e5e9ef"/>
    <rect x="182" y="68" width="64" height="64" rx="15" fill="#4775d1"/>
    <path d="M202 86h18l7 7v23h-25z" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round"/>
    <path d="M220 86v9h7m-18 8h11m-11 7h11" fill="none" stroke="white" stroke-width="2.5"/>
    <rect x="347" y="68" width="64" height="64" rx="15" fill="#465261"/>
    <path d="m362 90 11 10-11 10m19 0h14" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="512" y="68" width="64" height="64" rx="15" fill="#3b927e"/>
    <circle cx="544" cy="100" r="19" fill="none" stroke="white" stroke-width="2.5"/>
    <ellipse cx="544" cy="100" rx="8" ry="19" fill="none" stroke="white" stroke-width="2"/>
    <path d="M525 100h38m-35-9h32m-32 18h32" fill="none" stroke="white" stroke-width="2"/>
    <text x="626" y="110" fill="#57606a" font-size="30">…</text>
    <rect x="710" y="68" width="64" height="64" rx="15" fill="#ac6e48"/>
    <path d="m728 86 29 15-29 15z" fill="white"/>
    <g stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M214 151v18m-5-5 5 5 5-5"/>
      <path d="M379 151v18m-5-5 5 5 5-5"/>
      <path d="M544 151v18m-5-5 5 5 5-5"/>
      <path d="M742 151v18m-5-5 5 5 5-5"/>
    </g>
    <g fill="white" stroke="#d0d7de" stroke-width="1.5">
      <rect x="166" y="180" width="96" height="48" rx="10"/>
      <rect x="331" y="180" width="96" height="48" rx="10"/>
      <rect x="496" y="180" width="96" height="48" rx="10"/>
      <rect x="694" y="180" width="96" height="48" rx="10"/>
    </g>
    <g fill="#24292f" font-size="25" font-weight="600">
      <text x="214" y="212">⌘1</text>
      <text x="379" y="212">⌘2</text>
      <text x="544" y="212">⌘3</text>
      <text x="742" y="212">⌘0</text>
    </g>
    <text x="480" y="257" fill="#57606a" font-size="13">Illustration · follows your pinned app order · skips Finder · up to 10 apps</text>
  </g>
</svg>
